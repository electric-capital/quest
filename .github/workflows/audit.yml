name: Dependency audit

# Checks the locked Python and Node dependency sets against the public
# advisory databases. Runs when a lockfile or manifest changes, on every push
# to main, and once a week so advisories published against unchanged pins
# still surface. Unrelated PRs are not blocked: they do not touch these paths.
#
# When this fails: bump the flagged package with
# `uv lock --upgrade-package <name>` (see docs/setup/development-workflows.md,
# "Dependency audits") or `npm audit fix` in frontend/. Add an id to the
# ignore list below only when the advisory is unreachable in Quest or already
# mitigated in code, with a comment saying why and where.

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/audit.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# The jobs only read the checkout and query public advisory feeds.
permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (pip-audit over uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Export the locked dependency set
        run: uv export --frozen --all-groups --no-emit-project --no-hashes -o requirements-audit.txt

      - name: Audit
        # --no-deps: the export is already the fully resolved set; nothing to
        # install. Ignored ids, each by its GHSA alias:
        #   GHSA-g4r7-86gm-pgqc  sqlitedict pickle deserialization, no fixed
        #     release exists; api/gmail/helpers.py replaces the pickle codec
        #     with JSON (tests/test_gmail_url_cache_security.py).
        #   GHSA-86qp-5c8j-p5mr, GHSA-wqp7-x3pw-xc5r, GHSA-x746-7m8f-x49c,
        #   GHSA-82w8-qh3p-5jfq, GHSA-jp82-jpqv-5vv3  starlette: the fixed
        #     release needs the FastAPI 0.161 / Starlette 1.x bump, which is
        #     its own PR. Remove these when that lands.
        run: >
          uvx pip-audit -r requirements-audit.txt --no-deps --desc on
          --ignore-vuln GHSA-g4r7-86gm-pgqc
          --ignore-vuln GHSA-86qp-5c8j-p5mr
          --ignore-vuln GHSA-wqp7-x3pw-xc5r
          --ignore-vuln GHSA-x746-7m8f-x49c
          --ignore-vuln GHSA-82w8-qh3p-5jfq
          --ignore-vuln GHSA-jp82-jpqv-5vv3

  node:
    name: Node (npm audit over package-lock.json)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit
        # Reads the lockfile; no install needed. Dev dependencies are included
        # on purpose: they run on every developer machine and in CI.
        run: npm audit --audit-level=moderate
