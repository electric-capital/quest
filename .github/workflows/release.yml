name: Release

# Publishes a GitHub Release for every v<MAJOR>.<MINOR>.<PATCH> tag pushed
# by scripts/tag_release.py, with the tag's highlights above the generated
# notes. The running app reads the same tag at startup
# (config/version.py) to show the version in Settings > About.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [[ "$TAG" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          previous="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)"
          notes_args=(--generate-notes)
          if [[ -n "$previous" ]]; then
            notes_args+=(--notes-start-tag "$previous")
          fi
          # The tag message body (the highlights given to tag_release.py) goes
          # above the generated PR list. checkout can leave the pushed tag as a
          # lightweight ref, so re-fetch the annotated tag object first.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          highlights="$(git tag --list "$TAG" --format='%(contents:body)')"
          if [[ -n "${highlights//[[:space:]]/}" ]]; then
            printf '## Highlights\n\n%s\n\n' "$highlights" > highlights.md
            notes_args+=(--notes-file highlights.md)
          fi
          gh release create "$TAG" --title "$TAG" --verify-tag $prerelease_flag "${notes_args[@]}"
